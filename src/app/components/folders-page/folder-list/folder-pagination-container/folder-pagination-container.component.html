<div class="flex justify-between items-center mt-8">
    <app-results-counter [resultRange]="resultRange" [total]="numberOfFolders" />
    <app-pagination-buttons [page]="page" [pages]="pages" (changed)="setPage($event)" />
    <app-items-per-page-selector [currentOption]="foldersPerPage" [options]="foldersPerPageOptions" (changed)="setFoldersPerPage($event)" />
</div>
