<li class="flex justify-between gap-6 p-6 border-2 rounded-xl bg-gray-50 border-gray-200 shadow-2xs shadow-gray-50 dark:bg-zinc-800 dark:shadow-zinc-700 dark:border-zinc-700">
    <div class="flex items-center gap-6">
        <input class="min-w-5 min-h-5 cursor-pointer text-emerald-600 dark:text-emerald-700" type="checkbox" [checked]="isFolderSelected" (change)="toggleSelection()">
        <div>
            <div class="flex items-center gap-3">
                <h4 class="text-2xl font-bold">{{folder.name | sentencecase}}</h4>
            </div>
            <p class="text-gray-500">{{folder.description}}</p>
        </div>
    </div>
    <div class="relative" (close)="isDropdownOpen = false" appAutoClose>
        <ion-icon class="text-2xl ionicon-thick cursor-pointer hover:rotate-45 duration-300" name="settings-outline" (click)="toggleDropdownMenu(); $event.stopPropagation()"></ion-icon>
        @if (isDropdownOpen) {
        <div class="min-w-40 p-4 absolute top-0 right-full bg-gray-50 border-2 border-gray-200 rounded-md dark:bg-zinc-800 dark:border-zinc-700" id="dropdown">
            <ul class="flex flex-col gap-2">
                <li class="cursor-pointer" (click)="editFolder()">{{'folderlist.edit' | translate}}</li>
                <li class="cursor-pointer" (click)="deleteFolder()">{{'folderlist.delete' | translate}}</li>
                <li class="cursor-pointer" (click)="modifyWordList()">{{'folderlist.selectWords' | translate}}</li>
            </ul>
        </div>
        }
    </div>
</li>
