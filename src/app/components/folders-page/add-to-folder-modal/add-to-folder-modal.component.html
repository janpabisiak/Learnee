<app-modal [title]="'modal.addToFolder.title' | translate" (closeButtonClicked)="closeModal()" [primaryButtonText]="'modal.label.save' | translate" [secondaryButtonText]="'modal.label.cancel' | translate" (primaryButtonClicked)="selectWordsForFolder()" (secondaryButtonClicked)="closeModal()">
    <div class="flex flex-col gap-4">
        <app-search-bar [translationKey]="'wordlist.search'" (searched)="search($event)" />
        <div class="flex flex-col gap-3">
            @for (word of filteredWords; track word.id) {
            <div class="flex justify-between items-center w-full">
                <label [for]="word.name">{{ word.name }}</label>
                <input class="h-6 w-6 cursor-pointer" type="checkbox" [name]="word.name" [checked]="isWordSelected(word.id)" (click)="toggleSelection(word.id)" />
            </div>
            } @empty {
            <p class="text-center text-gray-500 py-4">{{ 'wordlist.noWords' | translate }}</p>
            }
        </div>
    </div>
</app-modal>
