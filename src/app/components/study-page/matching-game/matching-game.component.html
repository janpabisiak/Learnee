<div [ngClass]="!stage && isVisible ? 'animate-slideIn' : ''">
    <h2 class="text-4xl font-semibold mb-5"><span class="font-bold">{{currentStageId + 1}}.</span> {{'study.games.matching.description' | translate}}</h2>
    <div class="grid grid-cols-2 gap-8 mb-5">
        <app-draggable-items-list [items]="terms" [answered]="answered" [results]="results" (reordered)="reorder($event)" />
        <app-draggable-items-list [items]="definitions" [answered]="answered" [results]="results" (reordered)="reorder($event)" />
    </div>
    <div class="flex justify-end" *ngIf="!stage">
        @if (!answered) {
        <app-button class="[&>button]:w-48 [&>button]:justify-center" [type]="'primary'" (buttonClicked)="checkAnswers()" (enterClicked)="checkAnswers()">{{"study.games.checkAnswer.label" | translate}}</app-button>
        } @else {
        <app-button class="[&>button]:w-48 [&>button]:justify-center" [type]="'primary'" (buttonClicked)="nextStage()" (enterClicked)="nextStage()">{{ (isLastStage ? 'study.games.finish.label' : 'study.games.next.label') | translate }}</app-button>
        }
    </div>
</div>
