@if (stage) {
@switch (stage.type) {
@case (EAvailableGames.Quiz) {
<app-quiz-game [stage]="isResult ? stage : null" />
}
@case (EAvailableGames.MatchingGame) {
<app-matching-game [stage]="isResult ? stage : null" />
}
@case (EAvailableGames.TrueOrFalse) {
<app-true-false-game [stage]="isResult ? stage : null" />
}
@case (EAvailableGames.FillGaps) {
<app-fill-gaps-listening-game [stage]="isResult ? stage : null" />
}
@case (EAvailableGames.Listening) {
<app-fill-gaps-listening-game [stage]="isResult ? stage : null" />
}
}
}
