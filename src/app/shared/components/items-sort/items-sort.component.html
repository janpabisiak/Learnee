<select class="p-3 bg-gray-100 rounded-md border-1 border-gray-200 h-12 w-full dark:bg-zinc-800 dark:border-zinc-700" (change)="changeSortType(select.value)" #select>
    @for (sortOption of sortOptions; track sortOption.type) {
    <option [value]="sortOption.type" [selected]="sortOption.type === currentSortOption">{{sortOption.translationKey | translate}}</option>
    }
</select>
